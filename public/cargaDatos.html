<form id="formulario-producto">
  <input type="text" id="nombre" placeholder="Nombre del producto" required>
  <input type="number" step="0.01" id="precio" placeholder="Precio" required>
  <button type="submit">Guardar</button>
</form>

<script>
  document.getElementById('formulario-producto').addEventListener('submit', (evento) => {
    evento.preventDefault();

    const nombre = document.getElementById('nombre').value;
    const precio = parseFloat(document.getElementById('precio').value);

    guardarProducto(nombre, precio);
    evento.target.reset();
  });

  // Envía el producto al backend vía POST y muestra el id generado
  async function guardarProducto(nombre, precio) {
    const respuesta = await fetch('/api/productos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, precio })
    });
    const datos = await respuesta.json();
    console.log('Guardado con id:', datos.id);
  }
</script>
